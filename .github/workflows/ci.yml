name: stage187-ci

on:
  push:
  pull_request:

jobs:
  attack-driven-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install pyyaml
          python -m pip install -e ".[dev]"

      - name: Lint (Attack-Driven CI invariants)
        run: |
          python tools/lint_attack_driven_ci.py

      - name: Pytest
        run: |
          pytest -q

      - name: Generate audit summary
        run: |
          mkdir -p out/reports
          python tools/generate_audit_summary.py || true
          test -f out/reports/audit_summary.md || echo "(no audit summary generated)" > out/reports/audit_summary.md
          echo "---- audit_summary.md ----"
          cat out/reports/audit_summary.md || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: stage189-audit-reports
          path: out/reports/
